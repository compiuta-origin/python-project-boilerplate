[project]
version = "1.0.0"
description = "Python project boilerplate"
readme = "README.md"
keywords = ["python", "boilerplate"]
license = { file = "LICENSE" }
requires-python = ">=3.11"
name = "python-project-boilerplate"
authors = [{ name = "Compiuta srl", email = "info@compiuta.com" }]
dependencies = ["requests>=2.32.3"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "ruff>=0.7.3",
]

[project.scripts]
python_project_boilerplate = "python_project_boilerplate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = "tests"
